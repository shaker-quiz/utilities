name: Publish @shakerquiz/utilities

on:
  pull_request:
    types: [ closed ]
    branches:
      - aquamarine
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: aquamarine
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npm version patch
      - run: npm ci
      - run: npm publish --tag aquamarine
      - run: git commit -am "Commit autogenerated output" || true
      - run: git push --follow-tags
  updates:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Update and Publish ${{ github.repository_owner }}/url
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository_owner }}/url" \
            --raw-field pr=false \
            --raw-field utilities=true
